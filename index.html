<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="icon" type="image/png" href="./helpers_tech_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoParts Inventory &amp; Sales System</title>
    <style>
      /* Static boot placeholder — shown until React mounts and replaces #root's
         content. Plain inline CSS on purpose: no dependency on Tailwind/theme
         tokens that may not be injected yet at this point in the page load. */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0f172a;
        color: #94a3b8;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      }
      #boot-loader .spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #38bdf8;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-loader span {
        font-size: 13px;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader">
        <div class="spinner"></div>
        <span>جاري التحميل...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
