name: Build & Release Windows Installer

on:
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Windows installer (electron-builder)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The AUTOPARTS_LICENSE_PUBLIC_KEY env-var override in this file only
      # applies at runtime on whatever machine actually runs the packaged
      # app — setting it during the build step here would have no effect on
      # what ends up inside the shipped app.asar. The real key (otherwise
      # intentionally never committed — see .gitignore) has to be written
      # into the file itself before packaging.
      - name: Write real license public key
        shell: pwsh
        env:
          AUTOPARTS_LICENSE_PUBLIC_KEY: ${{ secrets.AUTOPARTS_LICENSE_PUBLIC_KEY }}
        run: node scripts/write-license-public-key.cjs

      # Optional — see scripts/write-license-heartbeat-url.cjs. If this
      # secret isn't set yet (e.g. the license portal isn't deployed yet),
      # this writes a null URL and the build ships with remote block/unblock
      # simply disabled, same as before this existed.
      - name: Write license heartbeat URL
        shell: pwsh
        env:
          AUTOPARTS_LICENSE_HEARTBEAT_URL: ${{ secrets.AUTOPARTS_LICENSE_HEARTBEAT_URL }}
        run: node scripts/write-license-heartbeat-url.cjs

      - name: Decode code-signing certificate
        shell: pwsh
        env:
          WIN_CSC_LINK_BASE64: ${{ secrets.WIN_CSC_LINK_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WIN_CSC_LINK_BASE64)
          $path = Join-Path $env:RUNNER_TEMP "code-signing-cert.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          echo "WIN_CSC_LINK=$path" >> $env:GITHUB_ENV

      # electron-builder auto-detects CI and tries to publish the artifact
      # itself via its own GitHub integration, which needs GH_TOKEN and would
      # duplicate the dedicated release step below — disable that with
      # --publish never instead of running the shared dist:win script as-is.
      #
      # WIN_CSC_LINK (set above) + WIN_CSC_KEY_PASSWORD (secret) make
      # scripts/sign-win.cjs sign from the decoded .pfx file instead of
      # looking the cert up in a local certificate store by thumbprint — see
      # that script for the store-based-vs-file-based signing switch.
      - name: Build Windows installer
        shell: pwsh
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          node scripts/prepare-dist-win.cjs
          npm run build
          npx electron-builder --win nsis --publish never

      - name: Locate installer artifact
        id: find_installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installer) { throw "No .exe artifact found under release/" }
          echo "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: ${{ steps.find_installer.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release with installer attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} — signed, real license key"
          body: |
            Automated CI build from commit ${{ github.sha }}.

            Signed with the Helpers Technologies code-signing certificate and
            verifies real production license serials.

            ⚠️ The certificate is **self-signed** (not issued by a public CA),
            so Windows SmartScreen will still show an "unknown publisher"
            prompt on first run regardless of signing — that only goes away
            with a CA-issued certificate. Functionally, this build is
            equivalent to a local `npm run dist:win` release.
          prerelease: true
          files: ${{ steps.find_installer.outputs.path }}
